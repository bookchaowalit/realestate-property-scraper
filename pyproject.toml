[project]
name = "realestate-property-scraper"
version = "0.1.0"
description = "DDproperty listing parsers and runner (book-property-scraping); offline fixtures only while property.v1 is pending."
requires-python = ">=3.10"
# Keep in sync with requirements.txt (the README install path uses it).
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    # Transitive floors (security): keep any resolution above published advisories.
    "anyio>=4.14.2",
    "idna>=3.15",
    "certifi>=2026.10.19",  # PYSEC-2026-4320 / GHSA-6q48-6c7w-9gw2 (via httpx)
    # Error reporting for runs (property/observability.py); off without SENTRY_DSN.
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff==0.16.9", "mypy==2.4.0"]

[tool.uv]
# Scripts and modules run from the checkout (pytest.ini puts the root on sys.path); nothing is built.
package = false

[tool.coverage.run]
source = ["property", "scrape_property_listings"]

[tool.mypy]
python_version = "3.10"
# tests/ has no __init__.py; map files to modules from the repository root.
explicit_package_bases = true
files = ["property", "scrape_property_listings.py", "tests"]
# Gradual: bodies are checked without requiring annotations everywhere. New modules are strict
# (override below); tighten the rest module by module.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["property.observability"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true
